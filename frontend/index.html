<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Expense Management System</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="app-header">
  <h1>💰 Expense Management System</h1>
</header>

<main class="container">

  <!-- Alert messages -->
  <div id="alertBox" class="alert hidden"></div>

  <!-- Form Section -->
  <section class="card">
    <h2 id="formTitle">Add Expense</h2>
    <form id="expenseForm" novalidate>
      <input type="hidden" id="expenseId">

      <div class="form-row">
        <div class="form-group">
          <label for="title">Title *</label>
          <input type="text" id="title" maxlength="150" required>
          <span class="error-msg" id="err-title"></span>
        </div>

        <div class="form-group">
          <label for="amount">Amount (₹) *</label>
          <input type="number" id="amount" step="0.01" min="0.01" required>
          <span class="error-msg" id="err-amount"></span>
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="category">Category *</label>
          <select id="category" required>
            <option value="">-- Select Category --</option>
            <option value="Food">Food</option>
            <option value="Transport">Transport</option>
            <option value="Education">Education</option>
            <option value="Shopping">Shopping</option>
            <option value="Bills">Bills</option>
            <option value="Health">Health</option>
            <option value="Entertainment">Entertainment</option>
            <option value="Other">Other</option>
          </select>
          <span class="error-msg" id="err-category"></span>
        </div>

        <div class="form-group">
          <label for="date">Date *</label>
          <input type="date" id="date" required>
          <span class="error-msg" id="err-date"></span>
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="payment_method">Payment Method</label>
          <select id="payment_method">
            <option value="Cash">Cash</option>
            <option value="Card">Card</option>
            <option value="UPI">UPI</option>
            <option value="Net Banking">Net Banking</option>
            <option value="Other">Other</option>
          </select>
        </div>

        <div class="form-group">
          <label for="description">Description</label>
          <input type="text" id="description" maxlength="300">
        </div>
      </div>

      <div class="form-actions">
        <button type="submit" class="btn btn-primary" id="submitBtn">Add Expense</button>
        <button type="button" class="btn btn-secondary hidden" id="cancelEditBtn">Cancel</button>
      </div>
    </form>
  </section>

  <!-- Filter Section -->
  <section class="card">
    <h2>Search &amp; Filter</h2>
    <div class="filter-row">
      <input type="text" id="searchInput" placeholder="Search by title/description">

      <select id="filterCategory">
        <option value="">All Categories</option>
        <option value="Food">Food</option>
        <option value="Transport">Transport</option>
        <option value="Education">Education</option>
        <option value="Shopping">Shopping</option>
        <option value="Bills">Bills</option>
        <option value="Health">Health</option>
        <option value="Entertainment">Entertainment</option>
        <option value="Other">Other</option>
      </select>

      <input type="date" id="filterDateFrom" title="From date">
      <input type="date" id="filterDateTo" title="To date">

      <button class="btn btn-primary" id="applyFilterBtn">Apply</button>
      <button class="btn btn-secondary" id="clearFilterBtn">Clear</button>
    </div>
  </section>

  <!-- Expense List Section -->
  <section class="card">
    <div class="list-header">
      <h2>Expenses</h2>
      <span id="totalAmount" class="total-badge">Total: ₹0.00</span>
    </div>
    <div class="table-wrapper">
      <table id="expenseTable">
        <thead>
          <tr>
            <th>Title</th>
            <th>Amount</th>
            <th>Category</th>
            <th>Date</th>
            <th>Payment</th>
            <th>Description</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="expenseTableBody">
          <!-- rows injected by JS -->
        </tbody>
      </table>
    </div>
    <p id="emptyMsg" class="empty-msg hidden">No expenses found.</p>
  </section>

</main>

<footer class="app-footer">
  <p>Expense Management System &copy; 2026 | Django REST Framework + Vanilla JS</p>
</footer>

<script src="js/app.js"></script>
</body>
</html>
